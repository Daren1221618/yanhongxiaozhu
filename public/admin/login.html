<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嫣红小主 · 管理后台</title>
  <style>
    :root {
      --primary: #B83A3A;
      --primary-dark: #7A1F1F;
      --gold: #C9A050;
      --bg: #FDF8F0;
      --surface: #FFFBF5;
      --text: #1F1D19;
      --text-secondary: #6B6560;
      --border: #D8D0C8;
      --font-display: 'Noto Serif SC', serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(31,29,25,0.08);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }
    .login-header p {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: var(--font-body);
      background: var(--bg);
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(184,58,58,0.08);
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: var(--primary);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
      min-height: 1.5rem;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>嫣红小主</h1>
      <p>内容管理后台</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">登 录</button>
    </form>
    <a href="/" class="back-link">← 返回官网首页</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    // Check if already logged in
    fetch('/api/check-auth')
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/admin/dashboard.html';
        }
      });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.error || '登录失败';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请重试';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
